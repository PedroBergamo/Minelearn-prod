<!DOCTYPE html>
 <html lang="en-us">
   <head>
     <meta charset="utf-8">
     <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Mine2learn</title>
   </head>
   <body style="text-align: center; padding: 0; border: 0; margin: 0;">
      <div id="unity-container" style="position: absolute; width: 100%; height: 100%">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>

<style>
    #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #010101;
    }
</style> 
<script src="Build/bin.loader.js"></script>
<script>
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    document.body.innerHTML = "<h2 style='color: red; text-align: center; padding: 20px;'>This game does not perform well on mobile devices. Please use a desktop for the best experience.</h2>";
  }

  function getIdealDevicePixelRatio(maxWidth, maxHeight) {
    var container = document.querySelector("#unity-container");
    if (!container) {
      console.warn("unity-container not found, falling back to devicePixelRatio 1");
      return 1;
    }

    var cssWidth = container.clientWidth;
    var cssHeight = container.clientHeight;
    var nativeDPR = window.devicePixelRatio || 1;

    var scaleX = maxWidth / (cssWidth * nativeDPR);
    var scaleY = maxHeight / (cssHeight * nativeDPR);
    var scale = Math.min(scaleX, scaleY, 1);

    return Math.max(nativeDPR * scale, 0.1);
  }

  createUnityInstance(document.querySelector("#unity-canvas"), {
    dataUrl: "Build/bin.data",
    frameworkUrl: "Build/bin.framework.js",
    codeUrl: "Build/bin.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Luleå University of Technology",
    productName: "MineLearn",
    productVersion: "0.5.4",
    devicePixelRatio: getIdealDevicePixelRatio(1920, 1080),
  });
</script>
</body>
</html>
